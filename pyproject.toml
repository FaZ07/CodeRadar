[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderadar"
version = "0.1.0"
description = "Instant codebase health radar — language breakdown, complexity hotspots, and tech debt in one beautiful CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohamed Fazil", email = "mohamedfazil1812700@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
coderadar = "coderadar.cli:main"

[project.urls]
Homepage = "https://github.com/FaZ07/coderadar"
Repository = "https://github.com/FaZ07/coderadar"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["coderadar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
